name: Lint

on:
  push:
  pull_request:

jobs:
  lint:
    name: Run on Ubuntu
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && vars.MILO_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Clone the code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Read golangci-lint version
        id: version
        run: echo "version=$(cat .golangci-version)" >> $GITHUB_OUTPUT

      - name: Run linter
        uses: golangci/golangci-lint-action@v8
        with:
          version: ${{ steps.version.outputs.version }}
