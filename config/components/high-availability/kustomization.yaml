apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# Production high-availability for auth-provider-openfga:
#   - authz-webhook: 3 replicas, spread across nodes/zones, PDB, HPA
#   - controller-manager: 2 replicas, spread across nodes (DoNotSchedule) and zones, PDB

resources:
  - authz-webhook-pdb.yaml
  - authz-webhook-hpa.yaml
  - controller-manager-pdb.yaml

patches:
  - target:
      kind: Deployment
      name: authz-webhook
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: authz-webhook
                app.kubernetes.io/part-of: auth-provider-openfga
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: authz-webhook
                app.kubernetes.io/part-of: auth-provider-openfga
  - target:
      kind: Deployment
      name: controller-manager
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2
      - op: add
        path: /spec/template/spec/topologySpreadConstraints
        value:
          - maxSkew: 1
            topologyKey: kubernetes.io/hostname
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: controller-manager
                app.kubernetes.io/part-of: auth-provider-openfga
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: ScheduleAnyway
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: controller-manager
                app.kubernetes.io/part-of: auth-provider-openfga
